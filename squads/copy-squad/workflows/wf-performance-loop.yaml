human_gates:
- gate: G3
  after_phase: PHASE-5
  owner: approval-owner
  task: tasks/approve-gate.md
  required_when: nova promessa, preço, garantia, resultado, data_privacy ou urgência/escassez na variação (G3 de texto, após o compliance)
  ttl_hours: 72
  decision_contract: contracts/approval-decision.schema.json
  note: Aprovação de claims.
- gate: G4
  after_phase: PHASE-6
  owner: approval-owner
  task: tasks/approve-gate.md
  required_when: sempre (o teste altera ativo em produção)
  ttl_hours: 72
  decision_contract: contracts/approval-decision.schema.json
  note: Aprova a variação antes de ir ao ar. Só approved com payload_sha256 igual libera a execução.
- gate: G5
  after_phase: PHASE-9
  owner: approval-owner
  task: tasks/correct-agent-failure.md
  required_when: sempre que humano corrigir output
  note: G5 não usa approval-request nem approval-decision. A correção humana passa por correct-agent-failure e vira learning-record.
error_handling:
  retry:
    max_attempts: 2
    backoff: imediato com contexto novo; sem repetir o mesmo prompt
    applies_to: falha técnica de agente, schema inválido, envelope incompleto
  rework_loop:
    max_cycles: 2
    on_exceeded: estado escalated_to_copy_chief (transição rework_exhausted) e depois approval-owner; nunca forçar aprovação
    rule: o produtor corrige somente os itens apontados pelo validador; versão nova v{n+1}, a anterior é preservada
  escalation:
  - to: copy-chief
    when: veto de quality gate, conflito entre validadores, contrato inválido após retry
  - to: approval-owner
    when: decisão estratégica, claim sem fonte, risco high não mitigado, rework esgotado
  on_veto: interromper a fase, registrar handoff com status blocked, abrir correct-agent-failure quando o humano corrigir o output (G5) e registrar
    o learning via register-learning
  on_timeout: 'silêncio nunca é aprovação: o pedido (expires_at = criação + 72h) permanece em awaiting_human_gate, o copy-chief reenvia ou escala conforme o SLA de 24h; decisão vencida (72h após decided_at) gera VETO em QG-PUBLISH-PREFLIGHT e nova rodada com novo approval-request e nova idempotency_key; nada é publicado'
  inconclusive_result: se a análise não atingir significância, registrar aprendizado inconclusivo e decidir com o approval-owner entre estender
    o teste ou encerrar
  failure_path:
    steps:
    - tasks/correct-agent-failure.md (G5)
    - tasks/register-learning.md
completion_signals:
- performance-analysis com hipóteses e next_actions
- variação aprovada em G4 e publicada com recibo
- resultado do teste analisado com critério de significância
- learning-record emitido
- nenhum vencedor declarado sem evidência
