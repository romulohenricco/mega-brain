    criteria:
    - approval-request com payload_sha256 válido e expires_at em até 72h
    - reviews de edição, voz e compliance anexadas
    - 'G4 approved (toda ação externa é no mínimo risco medium); approved_with_edits não autoriza execução e abre a rodada g4-r{n+1}'
