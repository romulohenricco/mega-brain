  agents:
  - compliance-checker
  - localization-specialist
  - copy-publisher
  - approval-owner
  parallel: false
  tasks:
  - task: tasks/fact-check-claims.md
    agent: compliance-checker
    required: true
    output: compliance-review
  - task: tasks/check-compliance.md
    agent: compliance-checker
    required: true
    output: compliance-review
    gate: G3
  - task: tasks/localize-copy.md
    agent: localization-specialist
    required: false
    output: localization
    condition: target_locale diferente de source_locale
    note: persistência 05-review/{asset_id}/localization-{locale}-v{n}.json (ADR-001 E3)
  - task: tasks/check-compliance.md
    agent: compliance-checker
    required: false
    output: compliance-review
    recheck: true
    condition: localize-copy executada (requires_compliance_recheck == true)
  - task: tasks/prepare-approval-package.md
    agent: copy-publisher
    required: false
    output: approval-request
    condition: claim sensível na copy final sem pré-aprovação (G3 de texto, ADR-001 D10)
    gate: G3
    note: pasta 06-approval/{asset_id}/g3-r{n}/; claim novo sem aprovação nunca vai direto ao G4
  - task: tasks/approve-gate.md
    agent: approval-owner
    required: false
    output: approval-decision
    condition: algum claim_type em price|guarantee|result|authority|testimonial|comparison|health|financial
