    human_review: true
    gate: G4
    message: Pacote pronto. Nada é publicado sem decisão G4 com sha256 igual.
  persisted_at: .data/copy-squad/{business}/{campaign_id}/06-approval/{asset_id}/
- id: PHASE-11
  slug: publication
  name: Publicação ou entrega e versões
  description: null
  agents:
  - copy-publisher
  parallel: false
  tasks:
  - task: tasks/publish-approved-asset.md
    agent: copy-publisher
    required: true
    output: publish-receipt
    note: o primeiro passo é o preflight em dois passos (ADR-001 D8); o copy-publisher roda scripts/approval_tools.py verify (verify --for-execution --request/--decision/--payload sobre a pasta da rodada 06-approval/{asset_id}/g4-r{n}/; o que se executa é o payload.json da rodada, igual a approval-request.payload, nunca o draft 04-drafts; ADR-001 E8) e o copy-chief contra-assina (QG-PUBLISH-PREFLIGHT) antes de qualquer execução externa; nenhum subagent executa ação externa, o copy-publisher emite o pacote de execução e registra o publish-receipt, e a execução é do humano ou da sessão principal depois da contra-assinatura (PUBLISH_EXECUTORS = [human, main_session]; ADR-001 E4)
  - task: tasks/manage-versions.md
    agent: copy-publisher
    required: false
    output: handoff-envelope
    note: fecha o changelog da versão publicada
  checkpoint:
    criteria:
    - preflight do copy-publisher (verify ok) contra-assinado pelo copy-chief antes da execução
    - destino, canal e operação iguais aos do approval-request (divergência é VETO)
    - verification.sha_match, approval_valid e not_expired verdadeiros
    - publish-receipt com rollback_plan
    - divergência de sha256 gera VETO sem executar
    human_review: false
    gate: null
    message: Entrega registrada em publish-receipt.
  persisted_at: .data/copy-squad/{business}/{campaign_id}/07-published/{asset_id}/
