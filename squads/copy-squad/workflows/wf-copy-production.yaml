quality_checklist:
- Cada fase consome o output da anterior e grava handoff-envelope
- Produtor nunca valida o próprio artefato (AP05)
- Nenhum claim sem fonte entra na copy final
- Urgência apenas com legitimate_urgency.exists == true
- Nada é publicado sem approval-decision válida e sha256 igual
- Quality gate executado antes do output final de cada fase
- Telemetria agent-runs.jsonl atualizada por execução
