  - task: tasks/build-cro-hypotheses.md
    agent: cro-analyst
    required: true
    output: performance-analysis
  checkpoint:
    criteria:
    - período e sample_size declarados
    - vencedor só declarado com critério de significância
    - hipóteses priorizadas por ICE
    - separação fatos, recomendações e hipóteses
    human_review: false
    gate: null
    message: Análise inicial emitida. Com poucos dados, nenhum vencedor é declarado.
  persisted_at: .data/copy-squad/{business}/{campaign_id}/08-performance/
- id: PHASE-13
  slug: learning
  name: Aprendizado e biblioteca
  description: null
  agents:
  - knowledge-curator
  - approval-owner
  parallel: false
  tasks:
  - task: tasks/correct-agent-failure.md
    agent: approval-owner
    required: false
    output: learning-record
    condition: 'caminho de falha: humano corrigiu output de agente'
    gate: G5
    note: G5 não usa approval-request; a correção humana vira learning-record (ADR-001 D5)
  - task: tasks/register-learning.md
    agent: knowledge-curator
    required: true
    output: learning-record
  - task: tasks/curate-asset-library.md
    agent: knowledge-curator
    required: false
    output: handoff-envelope
