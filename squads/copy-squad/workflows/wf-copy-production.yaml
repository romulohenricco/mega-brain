human_gates:
- gate: G1
  after_phase: PHASE-4
  owner: approval-owner
  task: tasks/approve-gate.md
  required_when: risk_level in [medium, high] ou primeira definição de voz (G3 de oferta no mesmo pacote quando risco high ou claim sensível na oferta)
  ttl_hours: 72
  decision_contract: contracts/approval-decision.schema.json
  note: Aprova objetivo, oferta, público e limites.
- gate: G2
  after_phase: PHASE-5
  owner: approval-owner
  task: tasks/approve-gate.md
  required_when: risk_level == high ou campanha multi-ativo
  ttl_hours: 72
  decision_contract: contracts/approval-decision.schema.json
  note: Escolhe os ângulos que seguem para escala.
- gate: G3
  after_phase: PHASE-9
  owner: approval-owner
  task: tasks/approve-gate.md
  required_when: claim_type sensível, data_privacy ou urgência/escassez presente (G3 de oferta junto ao G1; G3 de texto após o compliance)
  ttl_hours: 72
  decision_contract: contracts/approval-decision.schema.json
  note: Preço, garantia, resultado, autoridade, depoimento, comparativo, saúde, financeiro.
- gate: G4
  after_phase: PHASE-10
  owner: approval-owner
  task: tasks/approve-gate.md
  required_when: toda ação externa (publicar, enviar, veicular, alterar página); mínimo risco medium
  ttl_hours: 72
  decision_contract: contracts/approval-decision.schema.json
  note: Aprovação final antes de publicar, enviar ou veicular. Só approved com payload_sha256 igual libera a execução.
- gate: G5
  after_phase: PHASE-13
  owner: approval-owner
  task: tasks/correct-agent-failure.md
  required_when: sempre que humano corrigir output de agente
  note: G5 não usa approval-request nem approval-decision. A correção humana passa por correct-agent-failure e vira learning-record de referência.
error_handling:
  retry:
    max_attempts: 2
    backoff: imediato com contexto novo; sem repetir o mesmo prompt
    applies_to: falha técnica de agente, schema inválido, envelope incompleto
  rework_loop:
    max_cycles: 2
    on_exceeded: estado escalated_to_copy_chief (transição rework_exhausted) e depois approval-owner; nunca forçar aprovação
    rule: o produtor corrige somente os itens apontados pelo validador; versão nova v{n+1}, a anterior é preservada
  escalation:
  - to: copy-chief
    when: veto de quality gate, conflito entre validadores, contrato inválido após retry
  - to: approval-owner
    when: decisão estratégica, claim sem fonte, risco high não mitigado, rework esgotado
  on_veto: interromper a fase, registrar handoff com status blocked, abrir correct-agent-failure quando o humano corrigir o output (G5) e registrar
    o learning via register-learning
  on_timeout: 'silêncio nunca é aprovação: o pedido (expires_at = criação + 72h) permanece em awaiting_human_gate, o copy-chief reenvia ou escala conforme o SLA de 24h; decisão vencida (72h após decided_at) gera VETO em QG-PUBLISH-PREFLIGHT e nova rodada com novo approval-request e nova idempotency_key; nada é publicado'
  failure_path:
    trigger: output de agente reprovado por humano ou veto sem solução em 2 ciclos
    steps:
    - tasks/correct-agent-failure.md (G5, approval-owner)
    - tasks/register-learning.md (knowledge-curator)
    result: learning-record com reference_example before/after
completion_signals:
- execution-plan válido emitido
- todos os quality gates aplicáveis com score >= 0.80
- approval-decision válida com payload_sha256 igual ao do pacote
- publish-receipt gravado ou entrega interna registrada
- learning-record e biblioteca atualizados
