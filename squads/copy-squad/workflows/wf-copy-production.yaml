  name: Ideação de ângulos e hooks
  description: null
  agents:
  - hook-angle-creator
  - copy-chief
  - copy-publisher
  - approval-owner
  parallel: false
  tasks:
  - task: tasks/generate-angles-hooks.md
    agent: hook-angle-creator
    required: true
    output: angles
    gate: G2
    note: shortlist de 5 ângulos (ANGLES_SHORTLIST_SIZE) para o G2, a partir de no mínimo 20 (MIN_ANGLES_FULL); caminho do G2 = hook-angle-creator -> copy-chief (QG-ANGLES) -> copy-publisher (prepare-approval-package) -> approval-owner, nenhum produtor envia direto ao approval-owner (ADR-001 E3)
  - task: tasks/prepare-approval-package.md
    agent: copy-publisher
    required: false
    output: approval-request
    condition: risk_level == high ou campanha multi-ativo
    gate: G2
    note: pasta 06-approval/_campaign/g2-r{n}/ com a shortlist; asset_id = campaign_id
  - task: tasks/approve-gate.md
    agent: approval-owner
    required: false
    output: approval-decision
    condition: risk_level == high ou campanha multi-ativo
    gate: G2
  checkpoint:
    criteria:
    - 'mínimo de 20 ângulos ranqueados com predicted_strength e reason (fase aplicada somente em risco high ou campanha multi-ativo)'
    - cada ângulo com proof_required e risk_level
    - ângulos com claim sensível marcados needs_approval
    - G2 registrada como approved quando risco high ou multi-ativo (approved_with_edits abre a rodada seguinte)
    human_review: true
    gate: G2
    message: Ângulos ranqueados. Em risco high, G2 define quais seguem para produção.
  persisted_at: .data/copy-squad/{business}/{campaign_id}/03-angles/
- id: PHASE-6
  slug: creation
  name: Criação roteada por formato
  description: O hook-angle-creator entrega o ângulo; cada tipo de demanda é roteado ao copywriter dono do formato. Só as tasks cujo when é verdadeiro
    rodam.
  agents:
  - conversion-copywriter
  - email-crm-copywriter
  - content-copywriter
  - video-social-scriptwriter
  - ux-writer
  parallel: true
  tasks:
  - task: tasks/write-landing-page.md
    agent: conversion-copywriter
    required: false
    output: conversion-copy
    when: demand_type == conversion e formato landing_page|sales_page
  - task: tasks/write-ad-variations.md
    agent: conversion-copywriter
    required: false
    output: conversion-copy
    when: canal inclui anúncio pago
  - task: tasks/optimize-ctas.md
    agent: conversion-copywriter
    required: false
    output: conversion-copy
    when: conversion-copy existente com CTA fraco ou a testar
  - task: tasks/build-email-sequence.md
    agent: email-crm-copywriter
    required: false
    output: email-journey
    when: demand_type == crm e jornada de várias mensagens
  - task: tasks/write-crm-message.md
    agent: email-crm-copywriter
    required: false
    output: email-journey
    when: mensagem única de CRM
  - task: tasks/write-content-piece.md
    agent: content-copywriter
    required: false
    output: content-piece
    when: demand_type == content ou demand_type == brand (manifesto, tagline) ou formato case_study|white_paper; peça de marca passa pela revisão do brand-voice-guardian na PHASE-8
  - task: tasks/write-video-script.md
    agent: video-social-scriptwriter
    required: false
    output: video-script
    when: demand_type == video, inclusive format vsl (VSL é do video-social-scriptwriter, nunca do conversion-copywriter)
  - task: tasks/write-social-captions.md
    agent: video-social-scriptwriter
    required: false
    output: video-script
    when: posts ou legendas sociais
  - task: tasks/write-ux-microcopy.md
    agent: ux-writer
    required: false
    output: ux-copy
    when: demand_type == product_ux
  - task: tasks/audit-ux-copy.md
    agent: ux-writer
    required: false
    output: ux-copy
    when: tela ou fluxo existente para auditar
  checkpoint:
    criteria:
    - ao menos um rascunho v1 por ativo pedido no execution-plan
    - cada rascunho cita brief_id e angle_id aprovado
    - claims sensíveis listados em needs_approval
    - nenhuma prova, urgência ou número inventado
