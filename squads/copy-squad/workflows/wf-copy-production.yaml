  review_range:
  - 0.6
  - 0.79
  veto_below: 0.6
  on_review: rework max 2 ciclos
  on_veto: escalar copy-chief
- gate_id: QG-RESEARCH
  after_phase: PHASE-3
  applies_when: risk_level == high
  checklist: checklists/research-quality-checklist.md
  executor: compliance-checker
  min_score: 0.8
  review_range:
  - 0.6
  - 0.79
  veto_below: 0.6
  on_review: rework max 2 ciclos
  on_veto: escalar copy-chief
- gate_id: QG-BRIEF
  after_phase: PHASE-4
  checklist: checklists/brief-quality-checklist.md
  executor: copy-chief
  min_score: 0.8
  review_range:
  - 0.6
  - 0.79
  veto_below: 0.6
  on_review: rework max 2 ciclos
  on_veto: escalar copy-chief
- gate_id: QG-ANGLES
  after_phase: PHASE-5
  applies_when: risk_level == high ou campanha multi-ativo
  checklist: checklists/angle-quality-checklist.md
  executor: copy-chief
  min_score: 0.8
  review_range:
  - 0.6
  - 0.79
  veto_below: 0.6
