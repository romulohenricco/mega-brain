human_gates:
- gate: G1
  after_phase: PHASE-4
  owner: approval-owner
  task: tasks/approve-gate.md
  required_when: sempre (campanha é risco high)
  ttl_hours: 72
  decision_contract: contracts/approval-decision.schema.json
  note: Objetivo de 30 dias, oferta, público e limites. O G3 de oferta (preço, garantia, provas) segue no mesmo pacote.
- gate: G2
  after_phase: PHASE-5
  owner: approval-owner
  task: tasks/approve-gate.md
  required_when: sempre (campanha multi-ativo)
  ttl_hours: 72
  decision_contract: contracts/approval-decision.schema.json
  note: Seleção dos ângulos principais entre os 30.
- gate: G3
  after_phase: PHASE-9
  owner: approval-owner
  task: tasks/approve-gate.md
  required_when: sempre (preço, resultado, garantia, depoimento, data_privacy ou urgência/escassez presentes; G3 de oferta junto ao G1 e G3 de texto após o compliance)
  ttl_hours: 72
  decision_contract: contracts/approval-decision.schema.json
  note: Aprovação de claims.
- gate: G4
  after_phase: PHASE-10
  owner: approval-owner
  task: tasks/approve-gate.md
  required_when: sempre
  ttl_hours: 72
  decision_contract: contracts/approval-decision.schema.json
  note: Aprovação final por ativo, pedido por prepare-approval-package. Só a decisão approved sobre o payload_sha256 recalculado libera a publicação; approved_with_edits reabre a fase com nova versão e novo hash.
- gate: G5
  after_phase: PHASE-12
  owner: approval-owner
  task: tasks/correct-agent-failure.md
  required_when: sempre que humano corrigir output
  note: G5 não usa approval-request nem approval-decision. A correção humana passa por correct-agent-failure e vira learning-record.
error_handling:
  retry:
    max_attempts: 2
    backoff: imediato com contexto novo; sem repetir o mesmo prompt
    applies_to: falha técnica de agente, schema inválido, envelope incompleto
  rework_loop:
    max_cycles: 2
    on_exceeded: estado escalated_to_copy_chief (transição rework_exhausted) e depois approval-owner; nunca forçar aprovação
    rule: o produtor corrige somente os itens apontados pelo validador; versão nova v{n+1}, a anterior é preservada
  escalation:
  - to: copy-chief
    when: veto de quality gate, conflito entre validadores, contrato inválido após retry
  - to: approval-owner
    when: decisão estratégica, claim sem fonte, risco high não mitigado, rework esgotado
  on_veto: interromper a fase, registrar handoff com status blocked, abrir correct-agent-failure quando o humano corrigir o output (G5) e registrar
    o learning via register-learning
  on_timeout: 'silêncio nunca é aprovação: o pedido (expires_at = criação + 72h) permanece em awaiting_human_gate, o copy-chief reenvia ou escala conforme o SLA de 24h; decisão vencida (72h após decided_at) gera VETO em QG-PUBLISH-PREFLIGHT e nova rodada com novo approval-request e nova idempotency_key; nada é publicado'
  failure_path:
    trigger: ativo reprovado em G3 ou G4, ou veto sem solução em 2 ciclos
    steps:
    - tasks/correct-agent-failure.md (G5)
    - tasks/register-learning.md
    result: learning-record; os demais ativos seguem independentes
  asset_isolation: a falha de um ativo não bloqueia ativos aprovados, exceto se o claim central for comum a todos
completion_signals:
- todos os ativos pedidos aprovados em G4 ou conscientemente descartados pelo approval-owner
- publish-receipt por ativo publicado
- 30 ângulos e a decisão de G2 registrados
- learning-record e biblioteca atualizados
- handoff para wf-performance-loop emitido
