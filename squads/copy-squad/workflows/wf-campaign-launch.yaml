# wf-campaign-launch — campanha multi-ativo (exemplo da parte 2 da pesquisa)
metadata:
  id: wf-campaign-launch
  name: Lançamento de campanha multi-ativo
  version: 1.0.0
  atomic_layer: Organism
  squad: copy-squad
  owner: copy-chief
  description: 'Exemplo ilustrativo: ''Aumentar as vendas da mentoria de gestão financeira para pequenas empresas em 30 dias''. Ativos: 1 landing
    page, sequência de e-mails, conjunto de anúncios e 1 vídeo de vendas, a partir de 30 ângulos.'
  persistence_root: .data/copy-squad/{business}/{campaign_id}/
best_for:
- campanha de curso, mentoria ou produto com vários ativos coordenados (landing page, e-mails, anúncios, vídeo)
- meta de vendas em janela curta, como 30 dias
- necessidade de 20 a 30 ângulos (shortlist de 5 para o G2) e coerência entre canais
when_not_to_use:
- 'peça única: usar wf-copy-production'
- 'apenas variações de headline ou CTA: usar wf-fast-variation'
- 'reaproveitar um ativo longo: usar wf-content-repurposing'
- 'análise de resultados: usar wf-performance-loop'
inputs:
  required:
  - name: raw_request
    type: string
  - name: business
    type: slug
  - name: kpi_target
    type: string
    note: informado pelo solicitante
  optional:
  - name: campaign_id
    type: string
  - name: budget
    type: number
  - name: deadline
    type: date
state_machine:
  initial: created
  states:
  - created
  - phase-1_intake-plan
  - phase-2_strategy
  - phase-3_research
  - phase-4_brief-consolidation
  - phase-5_ideation
  - phase-6_creation
  - phase-7_editing
  - phase-8_brand-voice
  - phase-9_compliance
  - phase-9b_ab-test-design
  - phase-10_approval-package
  - phase-11_publication
  - phase-12_learning
  - awaiting_human_gate
  - escalated_to_copy_chief
  - failure_correction
  - completed
  - vetoed
  - cancelled
  terminal_states:
  - completed
  - vetoed
  - cancelled
  transitions:
  - from: created
    to: phase-1_intake-plan
    'on': plan_approved
    guard: demand_intake.missing_information == [] or questions_answered == true
  - from: phase-1_intake-plan
    to: phase-2_strategy
    'on': phase_complete
    guard: checkpoint.criteria_met == true and quality_gate.score >= 0.80
  - from: phase-1_intake-plan
    to: phase-1_intake-plan
    'on': quality_review
    guard: 0.60 <= quality_gate.score < 0.80 and rework_count < 2
  - from: phase-1_intake-plan
    to: vetoed
    'on': quality_veto
    guard: quality_gate.score < 0.60 or veto_condition == true
  - from: phase-1_intake-plan
    to: escalated_to_copy_chief
    'on': rework_exhausted
    guard: 0.60 <= quality_gate.score < 0.80 and rework_count >= 2; escalar ao copy-chief e depois ao approval-owner, nunca forçar aprovação
  - from: phase-2_strategy
    to: phase-3_research
    'on': phase_complete
    guard: checkpoint.criteria_met == true and quality_gate.score >= 0.80
  - from: phase-2_strategy
    to: phase-2_strategy
    'on': quality_review
    guard: 0.60 <= quality_gate.score < 0.80 and rework_count < 2
  - from: phase-2_strategy
    to: vetoed
    'on': quality_veto
    guard: quality_gate.score < 0.60 or veto_condition == true
  - from: phase-2_strategy
    to: escalated_to_copy_chief
    'on': rework_exhausted
    guard: 0.60 <= quality_gate.score < 0.80 and rework_count >= 2; escalar ao copy-chief e depois ao approval-owner, nunca forçar aprovação
  - from: phase-3_research
    to: phase-4_brief-consolidation
    'on': phase_complete
    guard: checkpoint.criteria_met == true and quality_gate.score >= 0.80
  - from: phase-3_research
    to: phase-3_research
    'on': quality_review
    guard: 0.60 <= quality_gate.score < 0.80 and rework_count < 2
  - from: phase-3_research
    to: vetoed
    'on': quality_veto
    guard: quality_gate.score < 0.60 or veto_condition == true
  - from: phase-3_research
    to: escalated_to_copy_chief
    'on': rework_exhausted
    guard: 0.60 <= quality_gate.score < 0.80 and rework_count >= 2; escalar ao copy-chief e depois ao approval-owner, nunca forçar aprovação
  - from: phase-4_brief-consolidation
    to: phase-5_ideation
    'on': phase_complete
    guard: checkpoint.criteria_met == true and quality_gate.score >= 0.80 and (human_gate.G1.required == false or (approval_decision.decision == approved and gate == G1))
  - from: phase-4_brief-consolidation
    to: phase-4_brief-consolidation
    'on': quality_review
    guard: 0.60 <= quality_gate.score < 0.80 and rework_count < 2
  - from: phase-4_brief-consolidation
    to: vetoed
    'on': quality_veto
    guard: quality_gate.score < 0.60 or veto_condition == true
  - from: phase-4_brief-consolidation
    to: escalated_to_copy_chief
    'on': rework_exhausted
    guard: 0.60 <= quality_gate.score < 0.80 and rework_count >= 2; escalar ao copy-chief e depois ao approval-owner, nunca forçar aprovação
  - from: phase-4_brief-consolidation
    to: awaiting_human_gate
    'on': g1_requested
    guard: human_gate.G1.required == true
  - from: awaiting_human_gate
    to: phase-4_brief-consolidation
    'on': g1_rejected
    guard: approval_decision.decision == rejected and gate == G1
  - from: awaiting_human_gate
    to: phase-5_ideation
    'on': g1_approved
    guard: approval_decision.decision == approved and gate == G1
  - from: awaiting_human_gate
    to: phase-4_brief-consolidation
    'on': g1_approved_with_edits
    guard: approval_decision.decision == approved_with_edits and gate == G1; o copy-publisher aplica as edições e abre a rodada seguinte (g1-r{n+1}) com novo payload_sha256, só approved libera a fase (ADR-001 D2)
  - from: phase-5_ideation
    to: phase-6_creation
    'on': phase_complete
    guard: checkpoint.criteria_met == true and quality_gate.score >= 0.80 and (human_gate.G2.required == false or (approval_decision.decision == approved and gate == G2))
  - from: phase-5_ideation
    to: phase-5_ideation
    'on': quality_review
    guard: 0.60 <= quality_gate.score < 0.80 and rework_count < 2
  - from: phase-5_ideation
    to: vetoed
    'on': quality_veto
    guard: quality_gate.score < 0.60 or veto_condition == true
  - from: phase-5_ideation
    to: escalated_to_copy_chief
    'on': rework_exhausted
    guard: 0.60 <= quality_gate.score < 0.80 and rework_count >= 2; escalar ao copy-chief e depois ao approval-owner, nunca forçar aprovação
  - from: phase-5_ideation
    to: awaiting_human_gate
    'on': g2_requested
    guard: human_gate.G2.required == true
  - from: awaiting_human_gate
    to: phase-5_ideation
    'on': g2_rejected
    guard: approval_decision.decision == rejected and gate == G2
  - from: awaiting_human_gate
    to: phase-6_creation
    'on': g2_approved
    guard: approval_decision.decision == approved and gate == G2
  - from: awaiting_human_gate
    to: phase-5_ideation
    'on': g2_approved_with_edits
    guard: approval_decision.decision == approved_with_edits and gate == G2; nova rodada (g2-r{n+1}) com novo payload_sha256, só approved libera a criação (ADR-001 D2)
  - from: phase-6_creation
    to: phase-7_editing
    'on': phase_complete
    guard: checkpoint.criteria_met == true and quality_gate.score >= 0.80
  - from: phase-6_creation
    to: phase-6_creation
    'on': quality_review
    guard: 0.60 <= quality_gate.score < 0.80 and rework_count < 2
  - from: phase-6_creation
    to: vetoed
    'on': quality_veto
    guard: quality_gate.score < 0.60 or veto_condition == true
  - from: phase-6_creation
    to: escalated_to_copy_chief
    'on': rework_exhausted
    guard: 0.60 <= quality_gate.score < 0.80 and rework_count >= 2; escalar ao copy-chief e depois ao approval-owner, nunca forçar aprovação
  - from: phase-7_editing
    to: phase-8_brand-voice
    'on': phase_complete
    guard: checkpoint.criteria_met == true and quality_gate.score >= 0.80
  - from: phase-7_editing
    to: phase-7_editing
    'on': quality_review
    guard: 0.60 <= quality_gate.score < 0.80 and rework_count < 2
  - from: phase-7_editing
    to: vetoed
    'on': quality_veto
    guard: quality_gate.score < 0.60 or veto_condition == true
  - from: phase-7_editing
    to: escalated_to_copy_chief
    'on': rework_exhausted
    guard: 0.60 <= quality_gate.score < 0.80 and rework_count >= 2; escalar ao copy-chief e depois ao approval-owner, nunca forçar aprovação
  - from: phase-8_brand-voice
    to: phase-9_compliance
    'on': phase_complete
    guard: checkpoint.criteria_met == true and quality_gate.score >= 0.80
  - from: phase-8_brand-voice
    to: phase-8_brand-voice
    'on': quality_review
    guard: 0.60 <= quality_gate.score < 0.80 and rework_count < 2
  - from: phase-8_brand-voice
    to: vetoed
    'on': quality_veto
    guard: quality_gate.score < 0.60 or veto_condition == true
  - from: phase-8_brand-voice
    to: escalated_to_copy_chief
    'on': rework_exhausted
    guard: 0.60 <= quality_gate.score < 0.80 and rework_count >= 2; escalar ao copy-chief e depois ao approval-owner, nunca forçar aprovação
  - from: phase-9_compliance
    to: phase-9b_ab-test-design
    'on': phase_complete
    guard: checkpoint.criteria_met == true and quality_gate.score >= 0.80 and (human_gate.G3.required == false or (approval_decision.decision == approved and gate == G3))
  - from: phase-9_compliance
    to: phase-9_compliance
    'on': quality_review
    guard: 0.60 <= quality_gate.score < 0.80 and rework_count < 2
  - from: phase-9_compliance
    to: vetoed
    'on': quality_veto
    guard: quality_gate.score < 0.60 or veto_condition == true
  - from: phase-9_compliance
    to: escalated_to_copy_chief
    'on': rework_exhausted
    guard: 0.60 <= quality_gate.score < 0.80 and rework_count >= 2; escalar ao copy-chief e depois ao approval-owner, nunca forçar aprovação
  - from: phase-9_compliance
    to: awaiting_human_gate
    'on': g3_requested
    guard: human_gate.G3.required == true
  - from: awaiting_human_gate
    to: phase-9_compliance
    'on': g3_rejected
    guard: approval_decision.decision == rejected and gate == G3
  - from: awaiting_human_gate
    to: phase-9b_ab-test-design
    'on': g3_approved
    guard: approval_decision.decision == approved and gate == G3
  - from: awaiting_human_gate
    to: phase-7_editing
    'on': g3_approved_with_edits
    guard: approval_decision.decision == approved_with_edits and gate == G3; exige nova versão do ativo, novo payload_sha256 e nova rodada (g3-r{n+1}), a decisão sobre o hash anterior não autoriza execução (ADR-001 D2)
  - from: phase-9b_ab-test-design
    to: phase-10_approval-package
    'on': phase_complete
    guard: checkpoint.criteria_met == true and test_design.stop_criteria_registered == true and test_design.mde_registered == true
  - from: phase-9b_ab-test-design
    to: phase-9b_ab-test-design
    'on': quality_review
    guard: 0.60 <= checkpoint.score < 0.80 and rework_count < 2
  - from: phase-9b_ab-test-design
    to: vetoed
    'on': quality_veto
    guard: veto_condition == true
  - from: phase-9b_ab-test-design
    to: escalated_to_copy_chief
    'on': rework_exhausted
    guard: 0.60 <= checkpoint.score < 0.80 and rework_count >= 2; escalar ao copy-chief e depois ao approval-owner, nunca forçar aprovação
  - from: phase-10_approval-package
    to: phase-11_publication
    'on': phase_complete
    guard: checkpoint.criteria_met == true and quality_gate.score >= 0.80 and approval_decision.decision == approved and gate == G4 and bound_match and approval_decision.payload_sha256 == recalculated_payload_sha256
  - from: phase-10_approval-package
    to: phase-10_approval-package
    'on': quality_review
    guard: 0.60 <= quality_gate.score < 0.80 and rework_count < 2
  - from: phase-10_approval-package
    to: vetoed
    'on': quality_veto
    guard: quality_gate.score < 0.60 or veto_condition == true
  - from: phase-10_approval-package
    to: escalated_to_copy_chief
    'on': rework_exhausted
    guard: 0.60 <= quality_gate.score < 0.80 and rework_count >= 2; escalar ao copy-chief e depois ao approval-owner, nunca forçar aprovação
  - from: phase-10_approval-package
    to: awaiting_human_gate
    'on': g4_requested
    guard: operation in [publish, send, run_ads, update_page]
  - from: awaiting_human_gate
    to: phase-10_approval-package
    'on': g4_rejected
    guard: approval_decision.decision == rejected and gate == G4
  - from: awaiting_human_gate
    to: phase-11_publication
    'on': g4_approved
    guard: approval_decision.decision == approved and gate == G4 and bound_match and approval_decision.payload_sha256 == recalculated_payload_sha256 and verify_ok
  - from: awaiting_human_gate
    to: phase-10_approval-package
    'on': g4_approved_with_edits
    guard: approval_decision.decision == approved_with_edits and gate == G4; exige nova versão, novo payload_sha256 e nova rodada (g4-r{n+1}), a decisão sobre o hash anterior não autoriza execução (ADR-001 D2)
  - from: phase-11_publication
    to: phase-12_learning
    'on': phase_complete
    guard: checkpoint.criteria_met == true and quality_gate.score >= 0.80 and preflight.copy_publisher_verify_ok == true and preflight.copy_chief_countersigned == true
  - from: phase-11_publication
    to: phase-11_publication
    'on': quality_review
    guard: 0.60 <= quality_gate.score < 0.80 and rework_count < 2
  - from: phase-11_publication
    to: vetoed
    'on': quality_veto
    guard: quality_gate.score < 0.60 or veto_condition == true
  - from: phase-11_publication
    to: escalated_to_copy_chief
    'on': rework_exhausted
    guard: 0.60 <= quality_gate.score < 0.80 and rework_count >= 2; escalar ao copy-chief e depois ao approval-owner, nunca forçar aprovação
  - from: phase-12_learning
    to: completed
    'on': phase_complete
    guard: checkpoint.criteria_met == true and quality_gate.score >= 0.80 and g5_pending == false; G5 não usa approval-request, é correct-agent-failure que gera o learning-record (ADR-001 D5)
  - from: phase-12_learning
    to: phase-12_learning
    'on': quality_review
    guard: 0.60 <= quality_gate.score < 0.80 and rework_count < 2
  - from: phase-12_learning
    to: vetoed
    'on': quality_veto
    guard: quality_gate.score < 0.60 or veto_condition == true
  - from: phase-12_learning
    to: escalated_to_copy_chief
    'on': rework_exhausted
    guard: 0.60 <= quality_gate.score < 0.80 and rework_count >= 2; escalar ao copy-chief e depois ao approval-owner, nunca forçar aprovação
  - from: awaiting_human_gate
    to: awaiting_human_gate
    'on': approval_response_overdue
    guard: gate in [G1, G2, G3, G4] and now > approval_request.expires_at; silêncio nunca é aprovação, o pedido permanece pendente (sem veto automático) e o copy-chief reenvia ou escala (SLA_HUMAN_GATE_HOURS = 24; ADR-001 D3)
  - from: phase-11_publication
    to: phase-10_approval-package
    'on': approval_decision_expired
    guard: now >= approval_decision.expires_at (decided_at + APPROVAL_TTL_HOURS = 72) antes da execução; VETO em QG-PUBLISH-PREFLIGHT e nova rodada g4-r{n+1} com novo approval-request
  - from: escalated_to_copy_chief
    to: phase-1_intake-plan
    'on': escalation_rework_authorized
    guard: copy_chief_or_approval_owner.decision == authorize_rework and escalated_from == phase-1_intake-plan
  - from: escalated_to_copy_chief
    to: phase-2_strategy
    'on': escalation_rework_authorized
    guard: copy_chief_or_approval_owner.decision == authorize_rework and escalated_from == phase-2_strategy
  - from: escalated_to_copy_chief
    to: phase-3_research
    'on': escalation_rework_authorized
    guard: copy_chief_or_approval_owner.decision == authorize_rework and escalated_from == phase-3_research
  - from: escalated_to_copy_chief
    to: phase-4_brief-consolidation
    'on': escalation_rework_authorized
    guard: copy_chief_or_approval_owner.decision == authorize_rework and escalated_from == phase-4_brief-consolidation
  - from: escalated_to_copy_chief
    to: phase-5_ideation
    'on': escalation_rework_authorized
    guard: copy_chief_or_approval_owner.decision == authorize_rework and escalated_from == phase-5_ideation
  - from: escalated_to_copy_chief
    to: phase-6_creation
    'on': escalation_rework_authorized
    guard: copy_chief_or_approval_owner.decision == authorize_rework and escalated_from == phase-6_creation
  - from: escalated_to_copy_chief
    to: phase-7_editing
    'on': escalation_rework_authorized
    guard: copy_chief_or_approval_owner.decision == authorize_rework and escalated_from == phase-7_editing
  - from: escalated_to_copy_chief
    to: phase-8_brand-voice
    'on': escalation_rework_authorized
    guard: copy_chief_or_approval_owner.decision == authorize_rework and escalated_from == phase-8_brand-voice
  - from: escalated_to_copy_chief
    to: phase-9_compliance
    'on': escalation_rework_authorized
    guard: copy_chief_or_approval_owner.decision == authorize_rework and escalated_from == phase-9_compliance
  - from: escalated_to_copy_chief
    to: phase-9b_ab-test-design
    'on': escalation_rework_authorized
    guard: copy_chief_or_approval_owner.decision == authorize_rework and escalated_from == phase-9b_ab-test-design
  - from: escalated_to_copy_chief
    to: phase-10_approval-package
    'on': escalation_rework_authorized
    guard: copy_chief_or_approval_owner.decision == authorize_rework and escalated_from == phase-10_approval-package
  - from: escalated_to_copy_chief
    to: phase-11_publication
    'on': escalation_rework_authorized
    guard: copy_chief_or_approval_owner.decision == authorize_rework and escalated_from == phase-11_publication
  - from: escalated_to_copy_chief
    to: phase-12_learning
    'on': escalation_rework_authorized
    guard: copy_chief_or_approval_owner.decision == authorize_rework and escalated_from == phase-12_learning
  - from: escalated_to_copy_chief
    to: vetoed
    'on': escalation_denied
    guard: copy_chief_or_approval_owner.decision == stop
  - from: '*'
    to: failure_correction
    'on': agent_failure
    guard: agent_run.status in [failed, escalated, blocked] and human_corrected == true
  - from: failure_correction
    to: phase-12_learning
    'on': g5_learning_registered
    guard: learning_record.learning_status in [approved, draft]; segue para a fase de aprendizado (register-learning)
  - from: failure_correction
    to: escalated_to_copy_chief
    'on': failure_unrecoverable
    guard: human_corrected == false and rework_count >= 2; falha irrecuperável escala ao copy-chief e depois ao approval-owner, nunca vai direto a vetoed (ADR-001 E5)
  - from: '*'
    to: cancelled
    'on': cancel
    guard: requester or copy-chief cancels; nothing external was executed
phases:
- id: PHASE-1
  slug: intake-plan
  name: Intake da campanha e plano multi-ativo
  description: 'Exemplo ilustrativo: ''Aumentar as vendas da mentoria de gestão financeira para pequenas empresas em 30 dias''. Ativos: 1 landing
    page, sequência de e-mails, conjunto de anúncios e 1 vídeo de vendas, a partir de 30 ângulos.'
  agents:
  - copy-chief
  parallel: false
  tasks:
  - task: tasks/intake-demand.md
    agent: copy-chief
    required: true
    output: demand-intake
  - task: tasks/plan-execution.md
    agent: copy-chief
    required: true
    output: execution-plan
  - task: tasks/monitor-pipeline.md
    agent: copy-chief
    required: false
    output: handoff-envelope
    runs: 'transversal: acompanha cada ativo da campanha em paralelo'
  checkpoint:
    criteria:
    - 'janela de 30 dias, KPI principal (ex.: vendas da mentoria) e meta numérica informada pelo solicitante, nunca presumida'
    - 'lista de ativos da campanha definida: landing page, e-mails, anúncios, vídeo'
    - risk_level = high (landing, anúncio pago, e-mail de venda, preço e garantia)
    - execution-plan com workflow_id = wf-campaign-launch e um step por ativo
    human_review: false
    gate: null
    message: Campanha planejada com ativos e meta. Confirme prazo e orçamento de mídia antes de seguir.
  persisted_at: .data/copy-squad/{business}/{campaign_id}/00-intake/
- id: PHASE-2
  slug: strategy
  name: 'Estratégia da campanha: audiência, oferta, objeções e provas'
  description: null
  agents:
  - brief-master
  - audience-voc
  - offer-strategist
  - knowledge-curator
  parallel: true
  tasks:
  - task: tasks/retrieve-knowledge.md
    agent: knowledge-curator
    required: false
    output: knowledge-query-result
    condition: biblioteca com ângulos, provas e aprendizados anteriores do negócio
  - task: tasks/create-brief.md
    agent: brief-master
    required: true
    output: brief
  - task: tasks/map-audience.md
    agent: audience-voc
    required: true
    output: audience-voc
    note: mapeia objeções de preço, tempo, confiança e resultado
  - task: tasks/extract-voc.md
    agent: audience-voc
    required: false
    output: audience-voc
    condition: há fontes reais de clientes
  - task: tasks/design-offer.md
    agent: offer-strategist
    required: true
    output: offer-canvas
    note: promessa, mecanismo, bônus, garantia
  - task: tasks/map-objections.md
    agent: offer-strategist
    required: true
    output: offer-canvas
  - task: tasks/build-proof-stack.md
    agent: offer-strategist
    required: true
    output: offer-canvas
    gate_note: depoimentos e cases só entram com uso autorizado (G3)
  checkpoint:
    criteria:
    - brief v1 com objetivo de 30 dias e público definidos
    - objeções de preço, tempo, confiança e resultado mapeadas com evidência
    - proof_stack com cada prova marcada verified e usage_rights
    - bônus e garantia só se fornecidos pelo solicitante
    - legitimate_urgency.exists só true com prazo real
    human_review: false
    gate: null
    message: Estratégia pronta. Provas sem autorização permanecem pendentes.
  persisted_at: .data/copy-squad/{business}/{campaign_id}/01-strategy/
- id: PHASE-3
  slug: research
  name: 'Pesquisa: concorrentes, cases e linguagem real'
  description: null
  agents:
  - research-analyst
  parallel: false
  tasks:
  - task: tasks/build-research-packet.md
    agent: research-analyst
    required: true
    output: research-packet
  - task: tasks/find-competitive-angles.md
    agent: research-analyst
    required: true
    output: research-packet
  checkpoint:
    criteria:
    - concorrentes e promessas do mercado mapeados com fonte
    - objeções reais citadas com evidência
    - fatos verified separados de unverified
    - gaps declarados
    human_review: false
    gate: null
    message: Research packet pronto para ideação.
  persisted_at: .data/copy-squad/{business}/{campaign_id}/02-research/
- id: PHASE-4
  slug: brief-consolidation
  name: Consolidação do brief e G1
