# Copy Squad — Squad de Copy agêntico (time profissional de copywriting)
# Fonte de verdade do squad. Componentes devem refletir o filesystem.
# Story: docs/stories/STORY-COPY-SQUAD.md

name: copy-squad
version: 1.0.2
short-title: "Copy Squad — time profissional de copy"
description: >-
  Squad funcional de copywriting que opera como um time profissional: estratégia,
  pesquisa, criação, edição, conformidade, dados e operação. Um agente por
  responsabilidade, contratos JSON de handoff, aprovação humana baseada em risco
  e aprendizado contínuo. Transforma uma demanda de negócio em copy que produz
  ação mensurável, sem inventar provas e sem publicar nada sem aprovação.
squad_type: hybrid                # pipeline de fases + executores Agent/Human/Worker
domain: copywriting
author: mega-brain
license: MIT
slashPrefix: copySquad
slash_prefix: copySquad
entry_agent: copy-chief
tested: false

