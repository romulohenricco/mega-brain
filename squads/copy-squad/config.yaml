modes:
  full:
    description: "Squad completo (padrão) — wf-copy-production / wf-campaign-launch"
  mvp:
    description: "Núcleo mínimo para começar com pouco volume: 10 agentes de IA mais o approval-owner (humano), conforme ADR-001 D22 e E6"
    agents: [copy-chief, brief-master, research-analyst, hook-angle-creator, conversion-copywriter, copy-editor, brand-voice-guardian, compliance-checker, cro-analyst, copy-publisher]
    human_roles: [approval-owner]
    # O copy-publisher faz parte do mvp porque a governança depende dele para pacotes de aprovação e hash. Regras:
    rules:
      - "O copy-publisher monta todo approval-request (G1, G2, G3, G4 e amostragem) via prepare-approval-package; o payload_sha256 é calculado por scripts/approval_tools.py hash, nunca por modelo."
      - "Nenhuma ação externa sem approval-decision com decision == approved, payload_sha256 idêntico ao do pedido e ao hash recalculado, dentro de decision.expires_at e com reviewer em human_gates.approvers."
      - "approved_with_edits nunca autoriza execução: abre a rodada seguinte com novo hash (D2)."
      - "O copy-chief contra-assina o preflight pós-decisão do copy-publisher (D8, E4); a execução externa é do humano ou da sessão principal (PUBLISH_EXECUTORS), o copy-publisher registra o publish-receipt e tudo vai ao journey log."
      - "O brand-voice-guardian está no mvp porque o preflight exige brand-review (QG-BRAND e PUB-4 valem sem dispensa). Sem audience-voc, offer-strategist e knowledge-curator, essas funções entram como lacuna em execution-plan.gate_gaps (nenhum agente produtor valida a própria saída)."
    # QG-LEARNING fica dispensado no mvp: o aprendizado fica em performance-analysis.next_actions até o knowledge-curator ser ativado (E6).
    mvp_waivers:
      - {gate: QG-LEARNING, reason: "knowledge-curator fora do mvp", replacement: "performance-analysis.next_actions", ref: "data/quality-gates.yaml mvp_waivers"}
  fast_lane:
    description: "Baixo risco, só uso interno ou teste (variações de headline, CTA e post não publicados) — wf-fast-variation, com QG-COMPLIANCE em modo leve; anúncio pago (high) e post orgânico (medium) saem da pista rápida (ADR-001, D6)"

