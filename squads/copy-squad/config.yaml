  readme_required: true
  scale: 0-1
  approve_min: 0.80
  review_min: 0.60
  ref: data/quality-gates.yaml

workspace_integration:
  level: read_only
  rationale: >-
    O squad lê contexto de marca/estratégia do workspace quando existir, mas não
    escreve no workspace. Todo artefato de runtime fica em .data/copy-squad/
    (gitignorado), separado por negócio e campanha.
  read_paths:
  - workspace/businesses/{business}/L0-identity/
  - workspace/businesses/{business}/L1-strategy/
  - workspace/businesses/{business}/L2-tactical/
  write_paths: []
  allowed_layers: [L0-identity, L1-strategy, L2-tactical]
  fallback: halt-with-missing-context

persistence:
  source_of_truth: filesystem
  runtime_root: .data/copy-squad/{business}/{campaign_id}/
  library_root: .data/copy-squad/{business}/_library/
  brand_root: .data/copy-squad/{business}/_brand/
  telemetry:
    agent_runs: .data/copy-squad/{business}/_telemetry/agent-runs.jsonl
    agent_evaluations: .data/copy-squad/{business}/_telemetry/agent-evaluations.jsonl
  journey_log: .data/logs/journey/lifecycle-events.jsonl
  rules:
  - "Drafts versionados (v1, v2, ...) e nunca sobrescritos"
  - "handoffs.jsonl, telemetria e journey log são append-only"
  - "Payload aprovado é imutável e verificado por sha256 antes de executar; o hash é sempre calculado por scripts/approval_tools.py hash, nunca por modelo (ADR-001, D1)"
  - "Governança: docs/governance-decisions.md (ADR-001) prevalece sobre qualquer outro arquivo do squad em caso de conflito"
  layout_ref: data/persistence-layout.yaml
  database_proposal: docs/database-proposal.md   # SQL proposto, NÃO aplicado

human_gates:
  owner: approval-owner
  gates:
  - {id: G1, name: "Aprovação do brief", required_for: [medium, high]}
  - {id: G2, name: "Aprovação de ângulo", required_for: [high]}
  - {id: G3, name: "Aprovação de claims (de oferta antes da produção e de texto após o compliance)", required_for: [claims_sensiveis, data_privacy, urgencia_escassez]}   # claims_sensiveis = os 8 tipos de HIGH_RISK_CLAIM_TYPES (E5)
  - {id: G4, name: "Aprovação final antes de publicar/enviar", required_for: [medium, high]}
  - {id: G5, name: "Correção de falha vira referência", required_for: [sempre_que_humano_corrigir]}
  sampling: {gate_value: SAMPLING, operation: internal_use, note: "Amostragem de risco low: approval-request com gate SAMPLING produzido pelo copy-publisher; não é gate G1 a G5 e nunca autoriza ação externa"}
  guards:
    publish: "approval_decision.decision == approved and gate == G4 and bound_match and approval_decision.payload_sha256 == recalculated_payload_sha256"   # E5: vale em todos os workflows; não existe ramo G4.required == false para ação externa
    preflight_timing: "QG-PUBLISH-PREFLIGHT é pós-decisão (E4): roda depois do G4 e antes da execução"
    publish_executors: [human, main_session]   # PUBLISH_EXECUTORS; nenhum subagent executa ação externa (E4)
  request_producer: copy-publisher     # produtor único de approval-request para G1, G2, G3, G4 e SAMPLING (ADR-001, D5); G5 não usa approval-request
  risk_policy_ref: data/risk-policy.yaml
  approval_ttl_hours: 72               # request.expires_at = prazo de resposta; decision.expires_at = decided_at + 72h = janela de execução (D3)
  # Identificadores de aprovadores humanos autorizados, por {business}. O HUMANO preenche esta lista por {business}
  # antes do primeiro G4; o squad nunca a preenche. Lista vazia (ou {business} ausente) bloqueia qualquer G4: a
  # decisão cujo reviewer não conste aqui, ou produzida por agente/modelo, é inválida (preflight bloqueia, D4).
  approvers:
    default: []   # ex.: ["id-do-aprovador"]; lista por negócio: {business}: [ids]

