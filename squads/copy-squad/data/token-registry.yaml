    - data/risk-policy.yaml
    - agents/copy-chief.md

- token_name: STRATEGIC_DECISIONS_HUMAN_ONLY
  family: Accountability
  value: [positioning, price, promise, segment, commercial_priority]
  description: Decisões que nenhum agente toma; o agente apresenta opções e o approval-owner decide.
  consumed_by:
    - agents/offer-strategist.md
    - agents/brief-master.md
    - agents/approval-owner.md
    - knowledge/human-in-the-loop.md

- token_name: EVALUATION_OWNERS
  family: Accountability
  value:
    quality_layer: copy-chief
    operational_layer: script
    business_layer: cro-analyst
    human_corrections: approval-owner
  description: Quem registra cada camada de avaliação em agent-evaluations.jsonl.
  consumed_by:
    - data/agent-metrics.yaml
    - checklists/agent-evaluation-scorecard.md
    - contracts/agent-evaluation.schema.json

# ============================================================================
# FAMÍLIA 9 — Mode (modos de execução)
# ============================================================================

- token_name: EXECUTION_MODE
  family: Mode
  value: full
  allowed: [full, mvp, fast_lane]
  description: Modo padrão do squad (full = squad completo; mvp = núcleo de 10 agentes de IA mais o approval-owner humano, ADR-001, D22 e E6; fast_lane = baixo risco, uso interno).
  consumed_by:
    - config.yaml
    - agents/copy-chief.md
    - tasks/plan-execution.md

- token_name: MVP_AGENTS
  family: Mode
  value: [copy-chief, brief-master, research-analyst, hook-angle-creator, conversion-copywriter, copy-editor, brand-voice-guardian, compliance-checker, cro-analyst, copy-publisher]
  description: >-
    Agentes de IA ativos no modo mvp (ADR-001, D22, E6): o copy-publisher entra porque a governança depende
    dele para pacotes de aprovação e hash; o brand-voice-guardian entra porque o preflight exige brand-review;
    o approval-owner (humano) completa o conjunto. QG-LEARNING é dispensado (mvp_waivers em quality-gates). As demais
    funções são marcadas como lacuna no plano; o copy-chief não absorve funções de publicação nem de aprovação.
  consumed_by:
    - config.yaml
    - tasks/plan-execution.md
    - agent-registry.yaml

- token_name: FAST_LANE_ELIGIBILITY
  family: Mode
  value:
    risk_level: low
    channel: internal_only
    allowed_operations: [headline_variation, cta_variation, post_variation, content_idea, internal_draft]
    forbidden_claim_types: [price, guarantee, result, authority, testimonial, comparison, health, financial]
    forbidden_destinations: [paid_media, owned_organic, email_to_customer_base]
    compliance_mode: light
  description: >-
    Condições cumulativas para usar wf-fast-variation (ADR-001, D6): uso interno ou teste, nunca publicado
    nem enviado; QG-COMPLIANCE roda em modo leve. Anúncio pago (high) e post orgânico (medium) saem da
    pista rápida e sobem para wf-copy-production, com prepare-approval-package e G4.
  consumed_by:
    - data/risk-policy.yaml
    - workflows/wf-fast-variation.yaml
    - tasks/plan-execution.md

- token_name: DRY_RUN
  family: Mode
  value: false
  description: Quando true, o copy-publisher verifica tudo e gera o publish-receipt com outcome handed_off, sem entregar ao canal.
  consumed_by:
    - agents/copy-publisher.md
    - tasks/publish-approved-asset.md

- token_name: LANGUAGE_DEFAULT
  family: Mode
  value: pt-BR
  description: Locale de origem padrão das peças (localization.source_locale quando não informado).
  consumed_by:
    - agents/localization-specialist.md
    - tasks/localize-copy.md
    - agents/brand-voice-guardian.md

# ============================================================================
# Cobertura
# ============================================================================
# Famílias: 9. Todo token tem consumed_by[] preenchido.
# consumed_by[] é declarativo (consumidores previstos); o validador estrutural
# (scripts/validate_copy_squad.py) confere que os arquivos citados existem.
