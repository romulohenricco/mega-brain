# ============================================================================
# FAMÍLIA 7 — Behavior (regras de comportamento e tratamento de erro)
# ============================================================================

- token_name: ON_MISSING_INFORMATION
  family: Behavior
  value: needs_input
  description: Falta informação crítica gera status needs_input com até MAX_CLARIFYING_QUESTIONS perguntas; nunca preenche lacuna com suposição silenciosa.
  consumed_by:
    - agents/copy-chief.md
    - agents/brief-master.md
    - tasks/intake-demand.md
    - tasks/create-brief.md

- token_name: ON_UNVERIFIED_CLAIM
  family: Behavior
  value: needs_approval
  description: Claim sem fonte entra como needs_approval ou unverified; nunca como fato. Exemplos e fixtures são marcados como ilustrativos.
  consumed_by:
    - agents/conversion-copywriter.md
    - agents/content-copywriter.md
    - agents/video-social-scriptwriter.md
    - agents/email-crm-copywriter.md
    - agents/compliance-checker.md

- token_name: ON_REVIEW_RESULT
  family: Behavior
  value: rework_to_producer
  description: Score na faixa REVIEW devolve o item ao produtor com feedback específico, até REWORK_MAX_CYCLES ciclos.
  consumed_by:
    - data/quality-gates.yaml
    - agents/copy-chief.md
    - tasks/monitor-pipeline.md

- token_name: ON_VETO_RESULT
  family: Behavior
  value: block_and_escalate
  description: VETO bloqueia a transição de fase e escala ao copy-chief (qualidade) ou ao approval-owner (risco, claim, decisão estratégica).
  consumed_by:
    - data/quality-gates.yaml
    - data/risk-policy.yaml
    - agents/copy-chief.md
    - agents/compliance-checker.md

- token_name: ON_PAYLOAD_MISMATCH
  family: Behavior
  value: veto_and_reopen_approval
  description: sha256 recalculado diferente do aprovado, ou destination, channel ou operation diferentes do que será executado, é VETO (ADR-001, D1); nada é executado e um novo approval-request precisa ser aberto.
  consumed_by:
    - data/risk-policy.yaml
    - agents/copy-publisher.md
    - tasks/publish-approved-asset.md
    - checklists/publish-preflight-checklist.md

- token_name: PAYLOAD_HASH_METHOD
  family: Behavior
  value: "sha256(json.dumps(payload, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode('utf-8'))"
  description: >-
    Método único de payload_sha256 (ADR-001, D1): cobre somente approval-request.payload, em hexadecimal
    minúsculo de 64 caracteres, sem NFC e sem normalização de quebra de linha. destination, channel e
    operation não entram no hash; o preflight os compara por igualdade. O hash nunca é calculado por
    modelo: sempre por python squads/copy-squad/scripts/approval_tools.py hash <approval-request.json>.
  consumed_by:
    - data/risk-policy.yaml
    - agents/copy-publisher.md
    - tasks/prepare-approval-package.md
    - tasks/publish-approved-asset.md
    - checklists/publish-preflight-checklist.md
    - contracts/approval-request.schema.json

- token_name: DECISION_RECORDED_VIA
  family: Behavior
  value: [human-cli, human-chat-confirmed]
  description: >-
    Meios válidos de registrar approval-decision (ADR-001, D4): human-cli (o humano roda
    approval_tools.py decide, com o prefixo ! no Claude Code) ou human-chat-confirmed (a sessão principal
    transcreve mensagem explícita do humano, citada literalmente em comments). Exige human_attested true.
  consumed_by:
    - data/risk-policy.yaml
    - agents/approval-owner.md
    - tasks/approve-gate.md
    - contracts/approval-decision.schema.json

- token_name: PRODUCER_VALIDATOR_SEPARATION
  family: Behavior
  value: true
  description: AP05. Quem produz um artefato nunca valida o próprio artefato; o executor do gate é sempre outro agente (ou o humano).
  consumed_by:
    - data/composition-rules.yaml
    - data/quality-gates.yaml
    - agents/copy-editor.md
    - agents/brand-voice-guardian.md
    - agents/compliance-checker.md

- token_name: APPEND_ONLY_LOGS
  family: Behavior
  value: [handoffs.jsonl, agent-runs.jsonl, agent-evaluations.jsonl, lifecycle-events.jsonl]
  description: Logs que só aceitam acréscimo; correção de registro errado é feita por novo evento compensatório.
  consumed_by:
    - data/persistence-layout.yaml
    - agents/copy-chief.md
    - agents/copy-publisher.md

- token_name: DRAFT_VERSIONING
  family: Behavior
  value: immutable_versions
  description: Drafts são salvos como v1, v2, v3 e nunca sobrescritos; o status mais recente fica no meta.status da maior versão.
  consumed_by:
    - data/persistence-layout.yaml
    - tasks/manage-versions.md
    - agents/copy-publisher.md

- token_name: RETRY_ON_TOOL_FAILURE
  family: Behavior
  value:
    attempts: 2
    backoff: linear
    then: escalate
  description: Falha transitória de ferramenta ou leitura permite 2 novas tentativas; persistindo, status failed no agent-run e escalonamento ao copy-chief.
  consumed_by:
    - agents/copy-chief.md
    - data/agent-metrics.yaml

- token_name: LEGITIMATE_URGENCY_ONLY
  family: Behavior
  value: true
  description: Urgência e escassez só aparecem na copy se offer-canvas.legitimate_urgency.exists = true com motivo real e prazo verificável.
  consumed_by:
    - knowledge/ethical-persuasion.md
    - agents/offer-strategist.md
    - agents/conversion-copywriter.md
    - agents/email-crm-copywriter.md
    - agents/compliance-checker.md

- token_name: NO_INVENTION
  family: Behavior
  value: true
  description: Nenhum depoimento, número de resultado, prêmio ou autoridade pode ser criado; exemplos de documentação usam dados ilustrativos rotulados.
  consumed_by:
    - knowledge/ethical-persuasion.md
    - agents/conversion-copywriter.md
    - agents/content-copywriter.md
    - agents/research-analyst.md
    - agents/hook-angle-creator.md
    - agents/compliance-checker.md

