meta:
  squad_scope: copy-squad
  version: 1.0.0
  purpose: >-
    Registro de tokens do Copy Squad. Nove famílias canônicas (Time, Capacity,
    Threshold, Priority, Permission, Taxonomy, Behavior, Accountability, Mode)
    com os valores concretos que agentes, tasks, workflows, checklists e
    contratos devem ler em vez de repetir números no texto.
  created_at: "2026-11-10"
  semantics: |
    consumed_by[] lista os arquivos do squad que DEVEM referenciar o token.
    Todo valor numérico de política (limites, prazos, limiares) vive aqui; um
    agente ou task que precise do número cita o nome do token. Mudar um valor
    exige alterar apenas este arquivo e registrar a mudança em
    docs/agent-changelog.md.
  value_notation: |
    Tokens escalares usam value:. Tokens compostos (listas, intervalos, mapas)
    usam value: com a estrutura completa. Unidades sempre explícitas no nome
    (_HOURS, _MIN, _PCT, _DAYS) ou no campo unit.
  families:
    - Time
    - Capacity
    - Threshold
    - Priority
    - Permission
    - Taxonomy
    - Behavior
    - Accountability
    - Mode

tokens:

# ============================================================================
# FAMÍLIA 1 — Time (prazos, SLAs, janelas, expiração)
# ============================================================================

- token_name: APPROVAL_TTL_HOURS
  family: Time
  value: 72
  unit: hours
  description: >-
    TTL de 72 h (ADR-001, D3), com dois usos distintos. (1) approval-request.expires_at =
    criação + 72 h = prazo de resposta: passou sem decisão, o pedido continua pendente
    (silêncio nunca é aprovação) e o copy-chief reenvia ou escala. (2) approval-decision.expires_at =
    decided_at + 72 h = janela de execução: o preflight exige now < decision.expires_at;
    decisão expirada exige nova rodada e novo approval-request pelo copy-publisher.
  consumed_by:
    - data/risk-policy.yaml
    - agents/copy-publisher.md
    - agents/approval-owner.md
    - tasks/prepare-approval-package.md
    - tasks/approve-gate.md
    - tasks/publish-approved-asset.md
    - checklists/publish-preflight-checklist.md
    - checklists/approval-gate-checklist.md
    - contracts/approval-request.schema.json
    - contracts/approval-decision.schema.json

- token_name: SLA_INTAKE_MIN
  family: Time
  value: 30
  unit: minutes
  description: Prazo para o copy-chief classificar a demanda e emitir demand-intake (ou devolver até 5 perguntas).
  consumed_by:
    - tasks/intake-demand.md
    - agents/copy-chief.md
    - workflows/wf-copy-production.yaml
    - workflows/wf-fast-variation.yaml

- token_name: SLA_PLAN_MIN
  family: Time
  value: 30
  unit: minutes
  description: Prazo para o copy-chief emitir o execution-plan depois que o intake estiver completo.
  consumed_by:
    - tasks/plan-execution.md
    - agents/copy-chief.md

- token_name: SLA_BRIEF_HOURS
  family: Time
  value: 4
  unit: hours
  description: Prazo para o brief-master entregar o brief v1 (rascunho) a partir de um intake completo.
  consumed_by:
    - tasks/create-brief.md
    - tasks/consolidate-brief.md
    - agents/brief-master.md

- token_name: SLA_RESEARCH_HOURS
  family: Time
  value: 8
  unit: hours
  description: Prazo para o research-analyst entregar o research-packet de uma campanha padrão.
  consumed_by:
    - tasks/build-research-packet.md
    - tasks/find-competitive-angles.md
    - agents/research-analyst.md

- token_name: SLA_ANGLES_HOURS
  family: Time
  value: 4
  unit: hours
  description: Prazo para o hook-angle-creator entregar o banco de ângulos ranqueado.
  consumed_by:
    - tasks/generate-angles-hooks.md
    - agents/hook-angle-creator.md

- token_name: SLA_DRAFT_HOURS
  family: Time
  value: 8
  unit: hours
  description: Prazo para um copywriter de produção entregar a primeira versão (v1) de um ativo.
  consumed_by:
    - tasks/write-landing-page.md
    - tasks/write-ad-variations.md
    - tasks/build-email-sequence.md
    - tasks/write-content-piece.md
    - tasks/write-video-script.md
    - tasks/write-ux-microcopy.md
    - workflows/wf-copy-production.yaml

- token_name: SLA_EDIT_HOURS
  family: Time
  value: 2
  unit: hours
  description: Prazo para o copy-editor devolver o edit-report depois de receber o draft.
  consumed_by:
    - tasks/edit-draft.md
    - tasks/edit-for-concision.md
    - agents/copy-editor.md

- token_name: SLA_QUALITY_REVIEW_HOURS
  family: Time
  value: 4
  unit: hours
  description: Prazo para brand-voice-guardian (brand-review) e compliance-checker (compliance-review) concluírem cada revisão.
  consumed_by:
    - tasks/review-brand-voice.md
    - tasks/check-compliance.md
    - tasks/fact-check-claims.md
    - tasks/localize-copy.md

- token_name: SLA_HUMAN_GATE_HOURS
  family: Time
  value: 24
  unit: hours
  description: >-
    Meta de resposta do approval-owner em G1–G4. Estourado o prazo, o copy-chief
    reenvia o pedido e registra o atraso; o SLA nunca autoriza aprovação tácita.
  consumed_by:
    - tasks/approve-gate.md
    - tasks/monitor-pipeline.md
    - agents/approval-owner.md
    - agents/copy-chief.md
    - checklists/approval-gate-checklist.md

- token_name: SLA_PUBLISH_MIN
  family: Time
  value: 60
  unit: minutes
  description: Prazo para o copy-publisher executar (ou entregar ao responsável pela execução) depois de aprovação válida.
  consumed_by:
    - tasks/publish-approved-asset.md
    - agents/copy-publisher.md

- token_name: PERFORMANCE_WINDOW_DAYS
  family: Time
  value: 7
  unit: days
  description: Janela mínima de coleta antes de o cro-analyst analisar um ativo publicado (ajustável por canal em data/channel-specs.yaml).
  consumed_by:
    - tasks/analyze-performance.md
    - agents/cro-analyst.md
    - workflows/wf-performance-loop.yaml

- token_name: LEARNING_REVIEW_DAYS
  family: Time
  value: 90
  unit: days
  description: Prazo padrão de review_after de um learning-record; depois dele o aprendizado é reavaliado antes de continuar valendo.
  consumed_by:
    - tasks/register-learning.md
    - agents/knowledge-curator.md
    - contracts/learning-record.schema.json

- token_name: TELEMETRY_RETENTION_DAYS
  family: Time
  value: 365
  unit: days
  description: Retenção mínima de agent-runs.jsonl e agent-evaluations.jsonl (append-only; arquivar, nunca editar).
  consumed_by:
    - data/persistence-layout.yaml
    - data/agent-metrics.yaml

# ============================================================================
# FAMÍLIA 2 — Capacity (limites de volume, perguntas, ciclos, paralelismo)
# ============================================================================

- token_name: MAX_CLARIFYING_QUESTIONS
  family: Capacity
  value: 5
  description: Máximo de perguntas objetivas que um agente pode devolver ao solicitante quando falta informação crítica.
  consumed_by:
    - agents/copy-chief.md
    - agents/brief-master.md
    - tasks/intake-demand.md
    - tasks/create-brief.md
    - checklists/intake-checklist.md
    - contracts/demand-intake.schema.json

- token_name: MIN_ANGLES_FULL
  family: Capacity
  value: 20
  description: Mínimo de ângulos distintos nos workflows completos (ADR-001, D9 e D11; a regra é do quality gate QG-ANGLES, não do schema).
  consumed_by:
    - agents/hook-angle-creator.md
    - tasks/generate-angles-hooks.md
    - checklists/angle-quality-checklist.md
    - data/quality-gates.yaml

- token_name: MIN_ANGLES_FAST_LANE
  family: Capacity
  value: 5
  description: Mínimo de ângulos distintos na fast_lane (ADR-001, D9; uso interno, risco low). É desvio consciente do mínimo de 20 (MIN_ANGLES_FULL), que vale nos workflows completos.
  consumed_by:
    - agents/hook-angle-creator.md
    - tasks/generate-angles-hooks.md
    - checklists/angle-quality-checklist.md
    - data/quality-gates.yaml

- token_name: MIN_VARIATIONS_FAST_LANE
  family: Capacity
  value: 5
  description: Mínimo de variações por elemento no modo fast_lane (headline, CTA, post).
  consumed_by:
    - workflows/wf-fast-variation.yaml
    - tasks/write-ad-variations.md
    - tasks/optimize-ctas.md
    - agents/conversion-copywriter.md

- token_name: MAX_ANGLES
  family: Capacity
  value: 50
  description: Teto de ângulos por rodada; acima disso o ranking perde valor e o G2 vira ruído.
  consumed_by:
    - agents/hook-angle-creator.md
    - tasks/generate-angles-hooks.md

- token_name: ANGLES_SHORTLIST_SIZE
  family: Capacity
  value: 5
  description: Quantidade exata de ângulos finalistas (shortlist) apresentados ao approval-owner em G2 (ADR-001, D9).
  consumed_by:
    - tasks/generate-angles-hooks.md
    - tasks/approve-gate.md

- token_name: REWORK_MAX_CYCLES
  family: Capacity
  value: 2
  description: Máximo de ciclos de retrabalho por gate (status REVIEW). Esgotado, o item escala ao copy-chief.
  consumed_by:
    - data/quality-gates.yaml
    - agents/copy-chief.md
    - tasks/monitor-pipeline.md
    - workflows/wf-copy-production.yaml
    - workflows/wf-campaign-launch.yaml
    - workflows/wf-fast-variation.yaml
    - workflows/wf-performance-loop.yaml
    - workflows/wf-content-repurposing.yaml

- token_name: MAX_PARALLEL_TASKS
  family: Capacity
  value: 4
  description: Teto de tasks de produção simultâneas por campanha (cada uma com ativo e asset_id distintos).
  consumed_by:
    - tasks/plan-execution.md
    - workflows/wf-campaign-launch.yaml
    - agents/copy-chief.md

- token_name: MAX_ASSETS_PER_CAMPAIGN
  family: Capacity
  value: 12
  description: Acima deste número de ativos a campanha deve ser dividida em ondas, cada uma com seu plano.
  consumed_by:
    - tasks/plan-execution.md
    - workflows/wf-campaign-launch.yaml

- token_name: MAX_EMAILS_PER_JOURNEY
  family: Capacity
  value: 10
  description: Teto de e-mails em uma única jornada gerada de uma vez (mais que isso exige segunda rodada com dados da primeira).
  consumed_by:
    - agents/email-crm-copywriter.md
    - tasks/build-email-sequence.md

- token_name: MAX_AB_VARIABLES
  family: Capacity
  value: 1
  description: Variáveis alteradas por teste A/B (isolamento de causalidade; testes multivariados exigem aprovação do cro-analyst).
  consumed_by:
    - agents/cro-analyst.md
    - tasks/design-ab-test.md
    - checklists/cro-test-checklist.md

# ============================================================================
# FAMÍLIA 3 — Threshold (limiares de qualidade, amostragem, estatística)
# ============================================================================

- token_name: QG_APPROVE_MIN
  family: Threshold
  value: 0.80
  scale: "0-1"
  description: Score mínimo para APPROVE em qualquer quality gate (escala 0–1).
  consumed_by:
    - data/quality-gates.yaml
    - data/composition-rules.yaml
    - checklists/agent-evaluation-scorecard.md
    - workflows/wf-copy-production.yaml
    - workflows/wf-campaign-launch.yaml
    - workflows/wf-fast-variation.yaml
    - workflows/wf-performance-loop.yaml
    - workflows/wf-content-repurposing.yaml

- token_name: QG_REVIEW_MIN
  family: Threshold
  value: 0.60
  scale: "0-1"
  description: Score mínimo da faixa REVIEW (0.60–0.79). Abaixo disso, ou com veto_condition, o resultado é VETO.
  consumed_by:
    - data/quality-gates.yaml
    - checklists/agent-evaluation-scorecard.md

- token_name: BRAND_ALIGNMENT_MIN
  family: Threshold
  value: 80
  scale: "0-100"
  description: brand_alignment_score mínimo do brand-review para approved_for_next_stage = true.
  consumed_by:
    - agents/brand-voice-guardian.md
    - tasks/review-brand-voice.md
    - checklists/brand-voice-review-checklist.md
    - data/quality-gates.yaml
    - contracts/brand-review.schema.json

- token_name: EDIT_QUALITY_MIN
  family: Threshold
  value: 80
  scale: "0-100"
  description: quality_score mínimo do edit-report para seguir à revisão de voz.
  consumed_by:
    - agents/copy-editor.md
    - tasks/edit-draft.md
    - checklists/edit-quality-checklist.md
    - contracts/edit-report.schema.json

- token_name: CONCISION_CUT_RANGE
  family: Threshold
  value:
    min_pct: 20
    max_pct: 40
  unit: percent
  description: >-
    Faixa de redução de palavras do edit-for-concision (reduction_pct). Cortar
    abaixo de 20% não cumpre o objetivo; acima de 40% exige justificativa e
    confirmação de que nenhum argumento ou claim aprovado foi perdido.
  consumed_by:
    - agents/copy-editor.md
    - tasks/edit-for-concision.md
    - checklists/edit-quality-checklist.md
    - contracts/edit-report.schema.json

- token_name: SAMPLING_RATE_LOW
  family: Threshold
  value: 0.20
  description: Fração dos ativos de risco low enviada a revisão humana por amostragem (seleção determinística por sha256 do asset_id, calculada por scripts/approval_tools.py sample, D21; pedido com gate SAMPLING, D5).
  consumed_by:
    - data/risk-policy.yaml
    - agents/copy-chief.md
    - tasks/approve-gate.md
    - workflows/wf-fast-variation.yaml

- token_name: SAMPLING_RATE_MEDIUM_AUDIT
  family: Threshold
  value: 0.10
  description: Fração dos ativos de risco medium já aprovados que é re-auditada por compliance-checker após a publicação (controle de qualidade do processo).
  consumed_by:
    - data/risk-policy.yaml
    - agents/compliance-checker.md
    - tasks/check-compliance.md

- token_name: MIN_RESEARCH_CONFIDENCE
  family: Threshold
  value: 0.60
  scale: "0-1"
  description: Confiança mínima do research-packet para alimentar a criação de ângulos sem validação adicional.
  consumed_by:
    - agents/research-analyst.md
    - tasks/build-research-packet.md
    - checklists/research-quality-checklist.md
    - contracts/research-packet.schema.json

- token_name: MIN_VERIFIED_FACTS_PCT
  family: Threshold
  value: 70
  unit: percent
  description: Percentual mínimo de facts com status verified no research-packet para passar em QG-RESEARCH sem REVIEW.
  consumed_by:
    - data/quality-gates.yaml
    - checklists/research-quality-checklist.md

- token_name: AB_CONFIDENCE_LEVEL
  family: Threshold
  value: 0.95
  scale: "0-1"
  description: >-
    Nível de confiança mínimo (0.95) para declarar vencedor em teste A/B (ADR-001, D20). Junto com
    AB_MIN_SAMPLE_PER_VARIANT é o critério padrão; sem atingir os dois, winner_declared = false.
    significance.confidence_level é número (ex.: 0.95), nunca texto. Critério diferente só se
    pré-registrado no design-ab-test antes do teste.
  consumed_by:
    - agents/cro-analyst.md
    - tasks/analyze-performance.md
    - tasks/design-ab-test.md
    - checklists/cro-test-checklist.md
    - contracts/performance-analysis.schema.json

- token_name: AB_MIN_SAMPLE_PER_VARIANT
  family: Threshold
  value: 1000
  unit: sessions_or_recipients
  description: Amostra mínima por variante (ADR-001, D20) quando o design-ab-test não pré-registra cálculo de tamanho amostral próprio; abaixo disso, ou sem AB_CONFIDENCE_LEVEL, winner_declared = false.
  consumed_by:
    - agents/cro-analyst.md
    - tasks/design-ab-test.md
    - checklists/cro-test-checklist.md

- token_name: MIN_CTA_CLARITY_SCORE
  family: Threshold
  value: 0.80
  scale: "0-1"
  description: Clareza mínima de CTA (ação específica, verbo, resultado esperado) para aprovação de conversion-copy.
  consumed_by:
    - tasks/optimize-ctas.md
    - checklists/conversion-copy-checklist.md

- token_name: AGENT_PASS_RATE_MIN
  family: Threshold
  value: 0.80
  scale: "0-1"
  description: Taxa mínima de avaliações aprovadas (passed = true) de um agente numa janela mensal; abaixo disso abre-se revisão de prompt.
  consumed_by:
    - data/agent-metrics.yaml
    - checklists/agent-evaluation-scorecard.md
    - agents/copy-chief.md

# ============================================================================
# FAMÍLIA 4 — Priority (prioridade e nível de risco)
# ============================================================================

- token_name: PRIORITY_LEVELS
  family: Priority
  value: [low, medium, high, critical]
  description: Escala de prioridade comercial da demanda (definida pelo solicitante, confirmada pelo copy-chief).
  consumed_by:
    - tasks/intake-demand.md
    - tasks/plan-execution.md
    - agents/copy-chief.md

- token_name: PRIORITY_DEFAULT
  family: Priority
  value: medium
  description: Prioridade assumida quando o solicitante não informa (registrada em assumptions).
  consumed_by:
    - tasks/intake-demand.md
    - contracts/demand-intake.schema.json

- token_name: RISK_LEVELS
  family: Priority
  value: [low, medium, high]
  description: Níveis de risco do contrato meta.risk_level, avaliados pelo risk-policy.
  consumed_by:
    - data/risk-policy.yaml
    - contracts/execution-plan.schema.json
    - contracts/handoff-envelope.schema.json

- token_name: RISK_DEFAULT_UNCLASSIFIED
  family: Priority
  value: high
  description: Risco assumido quando a operação ou o formato não consta na política (fail-safe; nunca assumir low).
  consumed_by:
    - data/risk-policy.yaml
    - agents/copy-chief.md
    - tasks/plan-execution.md

- token_name: GATE_PRIORITY_ORDER
  family: Priority
  value: [G3, G4, G1, G2, G5]
  description: Ordem de atendimento da fila do approval-owner (claims e publicação antes de brief e ângulo; G5 não bloqueia o fluxo).
  consumed_by:
    - tasks/approve-gate.md
    - tasks/monitor-pipeline.md
    - agents/approval-owner.md

# ============================================================================
# FAMÍLIA 5 — Permission (quem pode ler, escrever, aprovar, publicar)
# ============================================================================

- token_name: WORKSPACE_ACCESS
  family: Permission
  value: read_only
  description: O squad lê L0/L1/L2 do workspace do negócio; nunca escreve. Todo artefato de runtime vai para .data/copy-squad/.
  consumed_by:
    - context.yaml
    - agents/brief-master.md
    - agents/audience-voc.md
    - agents/offer-strategist.md
    - agents/brand-voice-guardian.md
    - config.yaml

- token_name: ALLOWED_WORKSPACE_LAYERS
  family: Permission
  value: [L0-identity, L1-strategy, L2-tactical]
  description: Camadas de workspace legíveis pelo squad. L3 e L4 ficam fora do escopo.
  consumed_by:
    - context.yaml
    - agents/copy-chief.md
    - config.yaml

- token_name: RUNTIME_WRITE_ROOT
  family: Permission
  value: ".data/copy-squad/{business}/"
  description: Única raiz de escrita permitida aos agentes (inclui {business}/_telemetry/, por negócio, e o journey log em modo append).
  consumed_by:
    - data/persistence-layout.yaml
    - agents/copy-chief.md
    - agents/copy-publisher.md
    - agents/knowledge-curator.md

- token_name: APPROVER_ROLES
  family: Permission
  value: [approval-owner]
  description: >-
    Único papel autorizado a emitir approval-decision, sempre humano (ADR-001, D4): recorded_via
    human-cli ou human-chat-confirmed, human_attested true, reviewer em config.yaml
    human_gates.approvers por {business}. Nenhum agente de IA aprova, nem por delegação; subagents
    nunca escrevem approval-decision.
  consumed_by:
    - data/risk-policy.yaml
    - agents/approval-owner.md
    - tasks/approve-gate.md
    - contracts/approval-decision.schema.json

- token_name: PUBLISH_EXECUTORS
  family: Permission
  value: [human, main_session]
  description: >-
    Quem pode executar a publicação (publish-receipt.executed_by). O copy-publisher
    prepara, verifica e emite o pacote de execução; nenhum subagent executa ação externa
    (E4). A execução é do humano ou da sessão principal, sempre depois da verificação de
    sha256, bound_to e TTL e da contra-assinatura do copy-chief.
  consumed_by:
    - agents/copy-publisher.md
    - tasks/publish-approved-asset.md
    - contracts/publish-receipt.schema.json

- token_name: EXTERNAL_ACTION_REQUIRES_APPROVAL
  family: Permission
  value: true
  description: >-
    Publicar, enviar, veicular, comprar mídia ou alterar página exige approval-decision com
    decision == approved (approved_with_edits nunca autoriza execução, ADR-001, D2), now <
    decision.expires_at e payload_sha256 igual ao do pedido e ao hash recalculado por
    scripts/approval_tools.py hash. Toda ação externa é no mínimo risco medium (D6).
  consumed_by:
    - data/risk-policy.yaml
    - agents/copy-publisher.md
    - agents/copy-chief.md
    - tasks/publish-approved-asset.md
    - checklists/publish-preflight-checklist.md

- token_name: HIGH_RISK_CLAIM_TYPES
  family: Permission
  value: [price, guarantee, result, authority, testimonial, comparison, health, financial]
  description: claim_type que escalam automaticamente o risco para high e exigem G3.
  consumed_by:
    - data/risk-policy.yaml
    - agents/compliance-checker.md
    - agents/copy-chief.md
    - tasks/check-compliance.md
    - tasks/fact-check-claims.md
    - contracts/compliance-review.schema.json

- token_name: GIT_OPERATIONS_AUTHORITY
  family: Permission
  value: out_of_scope
  description: Git push, PR e release não pertencem ao squad; são exclusivos do papel de devops do repositório.
  consumed_by:
    - agents/copy-publisher.md
    - agents/copy-chief.md

# ============================================================================
# FAMÍLIA 6 — Taxonomy (enums, prefixos, identificadores)
# ============================================================================

- token_name: ARTIFACT_ID_PREFIXES
  family: Taxonomy
  value:
    demand-intake: dmd
    execution-plan: pln
    brief: brf
    audience-voc: aud
    offer-canvas: ofr
    brand-voice-guide: bvg
    research-packet: rsp
    angles: ang
    conversion-copy: cvc
    content-piece: cnt
    ux-copy: uxc
    video-script: vid
    email-journey: eml
    edit-report: edt
    brand-review: bvr
    compliance-review: cpl
    localization: loc
    approval-request: apr
    approval-decision: apd
    publish-receipt: pub
    performance-analysis: prf
    learning-record: lrn
    knowledge-query-result: kqr
  description: >-
    Prefixo de três letras do artifact_id por contrato (padrão ^[a-z]{3}-[a-z0-9]+(-[a-z0-9]+)*$).
    meta.artifact_type é sempre o nome do contrato. Exceções: agent-run usa run_id
    (prefixo run-), agent-evaluation usa evaluation_id (evl-), handoff-envelope usa envelope_id (env-).
    O prefixo prf- é exclusivo de performance-analysis; proof_id de prova usa prv- (token PROOF_ID_PREFIX, E3).
  consumed_by:
    - data/persistence-layout.yaml
    - agents/copy-chief.md
    - contracts/handoff-envelope.schema.json
    - contracts/agent-run.schema.json
    - contracts/agent-evaluation.schema.json

- token_name: PROOF_ID_PREFIX
  family: Taxonomy
  value: prv
  description: >-
    Prefixo do proof_id das provas do offer-canvas e da biblioteca (prv-depoimento-01). O prefixo prf-
    é reservado ao artifact_id de performance-analysis, para evitar colisão de namespace (E3).
  consumed_by:
