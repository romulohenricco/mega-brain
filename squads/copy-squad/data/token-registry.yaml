    - agents/knowledge-curator.md
    - contracts/offer-canvas.schema.json

- token_name: IDEMPOTENCY_KEY_PATTERN
  family: Taxonomy
  value: "^camp-[a-z0-9]+(-[a-z0-9]+)*:[a-z0-9]+(-[a-z0-9]+)*:(g[1-4]|sampling):r[1-9][0-9]*:[0-9a-f]{12}$"
  description: >-
    Formato da idempotency_key do approval-request (E3): {campaign_id}:{asset_id}:{gate em minúsculas}:r{n}:{12
    primeiros hex do payload_sha256}. Em G1, G2 e G3 de oferta, asset_id = campaign_id; o gate SAMPLING entra como
    sampling. O pattern fica no schema do approval-request.
  consumed_by:
    - data/risk-policy.yaml
    - data/persistence-layout.yaml
    - contracts/approval-request.schema.json
    - agents/copy-publisher.md
    - tasks/prepare-approval-package.md

