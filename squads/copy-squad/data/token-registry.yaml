    - agents/copy-chief.md

- token_name: GATE_ESCALATION_TARGETS
  family: Accountability
  value:
    quality_veto: copy-chief
    risk_or_claim_veto: approval-owner
    strategic_decision: approval-owner
    schema_violation: copy-chief
    payload_mismatch: copy-chief
