    gates: "G3 (usage_rights do depoimento), G4"
    workflow: wf-copy-production
  - id: EX-05
    request: "Texto de erro de formulário em produto SaaS de fluxo de caixa (exemplo ilustrativo)."
    operation: ux_microcopy
    claims_detected: []
    channel: owned_organic
    risk_final: medium
    gates: "edit-report, brand-review, G4"
    workflow: wf-copy-production
