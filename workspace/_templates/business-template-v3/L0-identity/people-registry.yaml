# =============================================================================
# PEOPLE-REGISTRY.YAML — Per-Spoke Subset Template v3.0
# =============================================================================
# Purpose: People who belong to THIS business (local person_ids)
# Guardian: COO / HR
# Location: workspace/businesses/{slug}/L0-identity/people-registry.yaml
# Single-business spoke: no shared hub registry is shipped with this repository.
# See .claude/rules/hub-governance.md for the local governance contract.
#
# Source: ADR-GAP009 Section 6
# Owner: c-level-squad
# =============================================================================

_meta:
  id: null
  name: people-registry.yaml
  layer: L0-identity
  state: PLACEHOLDER
  owner: c-level-squad
  approver: founder
  version: "3.0.0"

metadata:
  version: "1.0"
  business: "FILL_THIS"
  status: "TEMPLATE"
  last_updated: "FILL_THIS"
  # Optional repo-relative path, only when a shared registry actually exists.
  hub_registry: null

# Local registry — entry keys match the local person_id.
# If hub_registry is configured, person_ids must also exist in that registry.
people:
  example-person:
    person_id: "FILL_THIS"        # Local identifier; shared ID only when configured
    allocation: 1.0               # 0.0-1.0 allocation to this business
    department: "FILL_THIS"       # e.g. "comercial", "operacoes", "tech"
    direct_leader: "FILL_THIS"    # person_id of leader in this business
    roles:
      - bu_id: "FILL_THIS"       # References bu-map.yaml bu_id
        title: "FILL_THIS"
        scope: "FILL_THIS"       # founder | leader | operator | specialist
        primary: true
    status: active                # active | inactive
    start_date: "FILL_THIS"      # YYYY-MM-DD
